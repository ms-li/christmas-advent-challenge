<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Advent Challenge</title>
<style>
:root{--ink:#fcebd0;--gold:#d9ad66;--panel:#0c281f;--wine:#681824;font-family:Georgia,"Times New Roman",serif;color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#0b211c;color:var(--ink)}
button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #ffe5a3;outline-offset:2px}
header{background:linear-gradient(100deg,#092b24,#142d24 65%,#46121b);border-bottom:2px solid #ba9154;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
h1{font-weight:normal;color:#f6dab0;font-size:clamp(21px,2.6vw,36px);margin:0;letter-spacing:.01em}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:9px;font-size:15px}
label{display:flex;gap:5px;align-items:center}
select,.control{color:#ffe7bb;background:#3a1b1d;border:1px solid #bb996a;border-radius:9px;padding:9px 11px}
.control.selected{background:#28533d}.control.danger{background:#811d28}.control:disabled{opacity:.4}
.line{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;background:#241f19;padding:8px 18px;font:13px system-ui,sans-serif}
.line strong{color:#ffdd9b} .line .scores{display:flex;gap:18px}
#sceneWrap{width:100%;max-width:1648px;margin:auto;position:relative}
#scene{width:100%;aspect-ratio:1648/928;position:relative;background:#122821 url("mountain-village-clean.png") center/100% 100% no-repeat;isolation:isolate;overflow:hidden}
#scene[data-theme="workshop"]{aspect-ratio:4/3;background-image:url("santas-workshop-clean.png")}
#scene[data-theme="food"]{aspect-ratio:4/3;background-image:url("festive-food-table-clean.png")}
#scene[data-theme="winter"]{aspect-ratio:4/3;background-image:url("winter-town-square-clean.png")}
.hotspot{position:absolute;transform:translate(-50%,-50%);border:1px solid #fff7;background:#480d16a3;box-shadow:inset 0 0 4px #0008,0 0 4px #000b;border-radius:6px;color:#fff3ca;font-size:clamp(10px,2.1vw,25px);font-weight:bold;text-shadow:1px 2px 3px #000;display:grid;place-items:center;padding:0;z-index:2;transition:background .15s,box-shadow .15s,transform .15s}
.hotspot:hover:not(:disabled){background:#77302cf0;box-shadow:0 0 0 2px #ffe4ae,0 0 18px #fff3a8;transform:translate(-50%,-50%) scale(1.06)}
.hotspot.opened{background:#112b24c9;color:#d4b782;opacity:.75}
.hotspot.opened::after{content:"✓";font-size:10px;position:absolute;right:1px;bottom:0}
#scene[data-theme="workshop"] .hotspot{background:#4b2719a6;border-color:#d8b67a;color:#ffe5b0}
#scene[data-theme="food"] .hotspot{background:#521924b9;border-color:#ffd9a0}
#scene[data-theme="winter"] .hotspot{background:linear-gradient(145deg,#7b1931dd,#203b2cde);border:2px solid #d5ad6a;border-radius:9px}
#ornaments{position:absolute;z-index:3;pointer-events:none}
.ornament{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;font-family:Georgia,serif;line-height:1;text-shadow:0 1px 3px #000,0 0 6px #ffebad}
.ornament.teacher{color:#fffdf5}.ornament.student{color:#a20b2b;-webkit-text-stroke:.55px #ffe9a7}
#mobileBoard{display:none}
#bottom{max-width:1648px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 17px;background:#182c24;font:13px system-ui,sans-serif}
#bottom p{margin:0;color:#dfceb1}
#bottom button{border:1px solid #caa567;background:#4d1f27;color:#fff1d3;padding:7px 12px;border-radius:8px}
#modal{position:fixed;inset:0;background:#020907d9;display:grid;place-items:center;padding:15px;z-index:20}
#modal[hidden]{display:none}
.dialog{width:min(690px,100%);max-height:94dvh;overflow:auto;background:linear-gradient(150deg,#faeed6,#e6cfaa);color:#2f241c;border:3px solid #c79a51;border-radius:17px;box-shadow:0 24px 80px #000d;padding:clamp(18px,3vw,32px)}
.dialog h2{color:#63202a;font-size:clamp(24px,3vw,36px);margin:6px 0 14px}
.dialog .type{text-transform:uppercase;color:#84613a;font:700 12px system-ui,sans-serif;letter-spacing:.08em}
.dialog .question{font-size:clamp(19px,2.2vw,26px);line-height:1.48;white-space:pre-line}
.dialog details{font:14px system-ui,sans-serif;background:#f1d8a8;padding:12px;border-radius:10px;margin:18px 0}
.dialog .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.dialog button{border:0;border-radius:8px;background:#691d2c;color:white;padding:12px 15px;font:600 14px system-ui,sans-serif}
.dialog button.alt{background:#49644f}.dialog button.neutral{background:#8c7254}.dialog .reminder{font:13px system-ui,sans-serif;color:#654a3c}
#finish{text-align:center}.finalTitle{font-size:clamp(29px,4vw,50px);color:#6d2430}
@media(max-width:850px){header{padding:10px}.controls{gap:6px}select,.control{padding:8px}.line{padding:7px 10px}#scene{min-height:0}.hotspot{font-size:clamp(9px,2.4vw,19px)}#mobileBoard{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding:8px;background:#163229}#mobileBoard button{min-height:37px;border:1px solid #bb995c;border-radius:7px;background:#521a24;color:#ffebc6}#mobileBoard button.opened{opacity:.4}#bottom{align-items:flex-start}}
@media(max-width:480px){h1{font-size:22px}.controls{font-size:13px}.hotspot{font-size:9px;border-radius:2px}.line{font-size:11px}.line .scores{gap:7px}.dialog .actions button{flex:1}}

/* V2 responsive immersive layout */
#sceneWrap{margin:0 auto;max-width:1648px}
#scene{background-size:100% 100%;background-repeat:no-repeat}
#mobileBoard{display:none!important}
.hotspot,#scene[data-theme="workshop"] .hotspot,#scene[data-theme="food"] .hotspot{

#modal{background:rgba(4,12,10,.52)}
.dialog{position:relative;background:rgba(255,255,255,.83);border:0;color:#2c2525;
 backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);

 padding:clamp(18px,3vw,32px);}

.dialog .type{color:#816474}
.dialog details{display:none}

.teacherNotes strong{display:block;color:#692233;margin-bottom:5px}
.modalClose{position:absolute;top:10px;right:10px;width:38px;height:38px;display:grid;place-items:center;
 border:0;border-radius:50%;background:#ffffff99;color:#672333;font:700 25px/1 system-ui,sans-serif;
 cursor:pointer}
.dialog .actions{display:flex;justify-content:center;align-items:stretch;gap:9px;flex-wrap:nowrap}
.dialog .actions button{flex:1 1 0;min-width:0;max-width:230px;min-height:50px;border-radius:9px;
 font:700 clamp(11px,1.5vw,15px)/1.25 system-ui,sans-serif;padding:9px}
.dialog .actions button.award{background:#771e32;color:white}
.dialog .actions button.noaward{background:#f1cdd5;color:#702137}
.dialog .actions button.cancel{background:#99836c;color:white}

@media(max-width:480px){.hotspot{font-size:clamp(9px,2.5vw,15px)} .dialog .actions button{flex:1 1 0;font-size:11px}}

/* V2.1: translucent snow-white challenge panel and Winter Town Square boards */
#modal{background:rgba(3,12,11,.29)}
#modal .dialog{
  background:rgba(255,255,255,.72);
  border:0;
  backdrop-filter:blur(3px);

}
#modal .dialog .teacherNotes{background:rgba(255,255,255,.54)}

#winterPanels .winterPanel{
  position:absolute;top:30%;height:53%;

}
#winterPanels .winterPanel.left{left:4.5%;width:22.5%}
#winterPanels .winterPanel.right{left:76.5%;width:20.5%}
#scene[data-theme="winter"] .hotspot{background:rgba(118,142,209,.12);color:#fff;border:0;box-shadow:none}
#scene[data-theme="winter"] .hotspot.opened{background:rgba(118,142,209,.06);color:#d7c19b}

/* V2.2: neutral snow-white rather than warm translucency */
#modal .dialog{
  background-color:rgba(255,255,255,.91);
  background-image:none;
  border:0;
  backdrop-filter:blur(2px) saturate(.8);
  -webkit-backdrop-filter:blur(2px) saturate(.8);
}
#modal .dialog .teacherNotes{
  background:rgba(255,255,255,.78);
}
#modal .dialog .modalClose{background:rgba(255,255,255,.77);color:#652033}
/* Town Square: readable but translucent blue placards behind both groups of numbers */
#scene[data-theme="winter"] #winterPanels .winterPanel{
  background-color:rgba(118,142,209,.32);
  background-image:none;
  border:0;
  box-shadow:none;
}
#scene[data-theme="winter"] .hotspot{
  background-color:rgba(118,142,209,.22);
  color:#fff;
  border:0;
  box-shadow:none;
}
#scene[data-theme="winter"] .hotspot:hover:not(:disabled){background:rgba(118,142,209,.28)}
#scene[data-theme="winter"] .hotspot.opened{
  background:rgba(118,142,209,.12);

}

/* V2.3: definitive cool-white frosted overlay and slightly stronger town panels.
   Background shorthand + !important prevents any old warm gradient from resurfacing. */
#modal .dialog {
  background:rgba(232,246,255,.53) !important;
  background-image:none !important;
  border:none !important;
  backdrop-filter:blur(1px);

}
#modal .dialog .teacherNotes {
  background:rgba(244,250,255,.58) !important;
}
#scene[data-theme="winter"] #winterPanels .winterPanel {
  background:rgba(118,142,209,.43) !important;
}
#scene[data-theme="winter"] .hotspot {
  background:rgba(118,142,209,.26) !important;
}
#scene[data-theme="winter"] .hotspot.opened {
  background:rgba(118,142,209,.13) !important;
}

/* V3 comprehensive responsive redesign: single source of truth for sizes/colors */
html,body{height:100%;min-height:0}
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{flex:0 0 auto}
.line{flex:0 0 auto;gap:8px}
#sceneWrap{
  flex:1 1 auto;min-height:0;min-width:0;
  display:flex;align-items:center;justify-content:center;
  width:100%!important;max-width:none;margin:0 auto;
  overflow:hidden;background:#0b211c;
}
#scene{flex:0 0 auto;max-width:100%;margin:0;background-size:100% 100%;background-position:center}
#bottom{flex:0 0 auto;width:100%;max-width:none;min-height:36px}
#mobileBoard{display:none!important}
/* Visible, clean white panel instead of warm/green translucent glass */
#modal{background:rgba(7,16,22,.40)!important;padding:clamp(7px,2vw,15px)}
#modal .dialog{
  background:rgba(244,250,255,.83)!important;
  background-image:none!important;
  border:0!important;
  color:#292b35;
  backdrop-filter:blur(2.5px) saturate(.8)!important;
  -webkit-backdrop-filter:blur(2.5px) saturate(.8)!important;
  width:min(760px,100%);max-height:calc(100dvh - 16px);
  padding:clamp(15px,2.4vw,30px);
  overflow-y:auto;overscroll-behavior:contain;
}
#modal .dialog h2{color:#682034;line-height:1.12;overflow-wrap:break-word;padding-right:24px}
#modal .dialog .question{color:#252632}
#modal .dialog .teacherNotes{
  background:rgba(250,252,255,.88)!important;color:#252632;
  margin:15px 0 3px;
}
#modal .dialog .actions{
  display:grid;grid-template-columns:repeat(var(--action-count,2),minmax(0,1fr));
  align-items:stretch;gap:9px;margin-top:20px;
}
#modal .dialog .actions button{
  width:100%;min-width:0;max-width:none;min-height:48px;
  font-size:clamp(11px,1.4vw,15px);padding:8px 9px;
}
#modal .dialog .modalClose{
  position:sticky;float:right;top:0;right:0;z-index:2;
  width:38px;height:38px;min-height:38px;margin:-8px -8px 0 3px;
  background:rgba(255,255,255,.85);color:#682034;
}
#rotateNotice{display:none}
@media (max-width:900px) and (orientation:portrait){
  body{overflow:hidden}
  header{padding:10px 14px;justify-content:center}
  header h1{font-size:clamp(18px,5vw,25px);text-align:center}
  header .controls,.line,#bottom,#sceneWrap{display:none!important}
  #rotateNotice{
    display:flex!important;flex:1;min-height:0;
    flex-direction:column;align-items:center;justify-content:center;
    gap:13px;text-align:center;padding:24px;
    background:radial-gradient(ellipse at 50% 30%,#31574a,#0b211c 70%);
    font:16px/1.4 system-ui,sans-serif;color:#f9edcf;
  }
  #rotateNotice .rotateIcon{font-size:64px;line-height:1;color:#e4c98d}
  #rotateNotice strong{font-size:clamp(20px,6vw,30px)}
  #rotateNotice span{max-width:260px;opacity:.86}
}
/* Phone landscape gets a one-line compact topbar and full remaining scene height */
@media (orientation:landscape) and (max-height:600px){
  header{
    padding:3px max(7px,env(safe-area-inset-right)) 3px max(7px,env(safe-area-inset-left));
    flex-wrap:nowrap;gap:7px;min-height:38px;
  }
  header h1{flex:0 0 auto;font-size:0;letter-spacing:0;white-space:nowrap}
  header h1::after{content:"Advent";font-size:16px}

  .controls select,.controls .control{
    min-height:32px;border-radius:6px;font-size:11px;

  }
  #level{width:49px;max-width:49px}
  #theme{width:min(22vw,148px);max-width:148px;text-overflow:ellipsis}

  #bottom{display:none!important}
  #rotateNotice{display:none!important}
  #sceneWrap{max-height:none}
  .hotspot{font-size:clamp(10px,1.6vw,18px)!important}
  .ornament{font-size:clamp(9px,1.3vw,17px)!important}
  #modal .dialog{max-height:calc(100dvh - 10px);width:min(730px,96vw);padding:12px 17px}
  #modal .dialog h2{font-size:clamp(20px,3.5vw,28px);margin:3px 0 8px}
  #modal .dialog .type{font-size:10px}
  #modal .dialog .question{font-size:clamp(15px,2.15vw,18px);line-height:1.38;margin:9px 0}

/* Narrow landscape phones sometimes require more space than a title */
@media (orientation:landscape) and (max-width:720px) and (max-height:600px){
  header h1::after{content:"❄";font-size:18px}
  .controls{gap:3px}
  #theme{width:min(26vw,125px)}
  .controls select,.controls .control{padding:4px;font-size:10px}
  .line .scores{gap:5px;font-size:10px}
}
/* Desktop: fit full game into viewport, text and controls don't dominate */
@media (min-width:901px) and (min-height:601px){

}

/* Tree ornaments: three SVG shapes, individually positioned, animated once */
.ornament{display:block;position:absolute;transform:translate(-50%,-50%);width:clamp(15px,2.25vw,36px);height:clamp(15px,2.25vw,36px);font-size:inherit;line-height:normal;text-shadow:none;filter:drop-shadow(0 1px 3px #07150fee) drop-shadow(0 0 2px #ffe0a088);pointer-events:none;z-index:3}
.ornament svg{width:100%;height:100%;display:block;overflow:visible}
.ornament.teacher{color:#fffdf7;-webkit-text-stroke:0}
.ornament.student{color:#a51637;-webkit-text-stroke:0}
.ornament.new{animation:ornamentArrive .55s cubic-bezier(.2,1.1,.4,1) both}
@keyframes ornamentArrive{0%{opacity:0;transform:translate(-50%,-90%) scale(.15) rotate(-22deg)}65%{opacity:1;transform:translate(-50%,-48%) scale(1.16) rotate(7deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
@media(prefers-reduced-motion:reduce){.ornament.new{animation:none}}
@media(orientation:landscape) and (max-height:600px){.ornament{width:clamp(12px,2vw,23px);height:clamp(12px,2vw,23px)}}
</style></head>
<body><header><h1>❄ Christmas Advent Challenge</h1><div class="controls">
<label><span class="controlLabel">Level</span><select id="level"><option>B1</option><option selected>B2</option><option>C1</option></select></label>
<label><span class="controlLabel">Scene</span><select id="theme"><option value="village">Snowy Mountain Village</option><option value="workshop">Santa's Workshop</option><option value="food">Festive Food Table</option><option value="winter">Winter Town Square</option></select></label>
<button class="control selected" id="classroom">Classroom ✓</button><button class="control" id="new">New Game</button><button class="control danger" id="end">End Session</button>
</div></header>
<div class="line"><span><strong id="turn">Teacher's turn</strong> · Find door <strong id="nextDoor">1</strong></span><div class="scores"><span>⚪ Teacher: <strong id="ts">0</strong></span><span>🔴 Student: <strong id="ss">0</strong></span><span><strong id="doors">0</strong>/24 opened</span></div></div>
<main id="sceneWrap"><section id="scene" data-theme="village" aria-label="Christmas advent board and shared scoring tree"><div id="winterPanels" aria-hidden="true"><div class="winterPanel left"></div><div class="winterPanel right"></div></div><div id="hotspots"></div><div id="ornaments"></div></section></main>
<div id="mobileBoard" aria-label="Mobile door selection"></div><div id="rotateNotice"><div class="rotateIcon" aria-hidden="true">↻</div><strong>Turn your phone sideways</strong><span>The Advent village is designed for landscape play.</span></div>
<div id="bottom"><p id="message">Classroom mode: two players share one screen. Find door 1 to begin.</p><button id="help">How to play</button></div>
<div id="modal" hidden><section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-label="Christmas challenge"></section></div>
<script>
const BANK=[
["B1","conf","The Unwanted Present","Tell us about a present you received but didn't really want. What was it? What did you say to the person who gave it to you?","The student may invent an example. Look for a past-tense narrative and a reaction."],
["B1","conf","Christmas Gone Wrong","Describe a Christmas celebration when something went wrong. What happened, and how did everyone react?","Can be fictional. Ask whether it was funny at the time or only later."],
["B1","brain","The Candle Puzzle","You light five candles. After ten minutes, two candles stop burning. The other three burn until there is nothing left. How many candles are left?","Two candles."],
["B1","brain","The Secret Christmas Message","Someone sends you this message: ‘I will bring the Christmas tree, but you must bring the STAR.’ You arrive with a star-shaped decoration. Your friend laughs and says, ‘That's not the star I meant!’ What else could your friend mean?","A famous person or the most important person at the celebration. Accept reasonable interpretations."],
["B1","picture","The Christmas Disaster","Look at the picture. Find four problems. What do you think happened five minutes before this moment?","Planned illustration: a falling tree, spilled drinks, broken decorations and an employee with a ladder. Image asset not yet supplied."],
["B1","picture","The Wrong Delivery","Look at the picture. What has the delivery driver brought? Why is this a problem? What should the family do now?","Planned illustration: an oversized Christmas tree at a small apartment. Image asset not yet supplied."],
["B1","dilemma","The Last-Minute Invitation","Your colleague invites you to a Christmas dinner tomorrow. You already have plans to relax at home. Do you accept or refuse? Explain how you would reply politely.","Look for a polite response."],
["B1","dilemma","The Christmas Budget","You have €100 for Christmas gifts. Would you buy one expensive present or several small ones? Who would receive them, and why?","Follow-up: what if prices increase?"],
["B1","word","Festive Word Detective","Describe the word ‘mistletoe’ without saying its name. Your opponent must guess it.","Answer: mistletoe."],
["B1","word","The Mystery Object","Describe ‘wrapping paper’ without saying the words ‘wrapping’ or ‘paper’. Your opponent must guess.","Answer: wrapping paper."],
["B1","luck","Christmas Compliment","Give your opponent a sincere Christmas compliment using at least two complete sentences. If they accept it, you both receive one decoration.","Award both players a decoration if accepted.","both"],

const $=id=>document.getElementById(id);
const shuffle=(arr)=>{arr=[...arr];for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr};
let state={turn:0,scores:[0,0],ornaments:[],nextOrnamentId:0,animatedIds:[],slotOrder:[],opened:[],used:[],numbers:[],ended:false,active:null};
function eligible(t){const m=state.scores[state.turn],o=state.scores[1-state.turn];return t[5]==="transfer1"?o>=1:t[5]==="trade2"?m>=1&&o>=2:true}
function selectTask(){const items=BANK.filter(t=>t[0]===$("level").value&&!state.used.includes(t[2])&&eligible(t));if(!items.length)return null;
const usedByCat={};state.used.forEach(title=>{let t=BANK.find(q=>q[2]===title);if(t)usedByCat[t[1]]=(usedByCat[t[1]]||0)+1});const min=Math.min(...items.map(t=>usedByCat[t[1]]||0));return shuffle(items.filter(t=>(usedByCat[t[1]]||0)===min))[0]}

function makeOrnamentSpots(){
 const a=[];
 for(let row=0;row<10;row++){
  const count=row+2, width=10+row*7.2, y=19+row*7;
  for(let col=0;col<count;col++)a.push([50-width/2+width*(col+.5)/count,y]);
 }
 return a;
}
const ornamentSlots=makeOrnamentSpots();
const SHAPES=["bauble","star","bell"];
function ornamentSVG(shape){
 const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
 svg.setAttribute("viewBox","0 0 40 44");svg.setAttribute("aria-hidden","true");
 const paths={
  bauble:'<path d="M17 8V5a3 3 0 0 1 6 0v3" fill="none" stroke="#ddbf84" stroke-width="2"/><rect x="16" y="8" width="8" height="4" rx="1" fill="#ddbf84"/><circle cx="20" cy="25" r="13" fill="currentColor" stroke="#d4ba83" stroke-width="1.2"/><ellipse cx="15" cy="19" rx="4" ry="6" fill="#fff" opacity=".28"/>',
  star:'<path d="M20 3L25 14L37 16L28 25L30 38L20 32L10 38L12 25L3 16L15 14Z" fill="currentColor" stroke="#d4ba83" stroke-width="1.35" stroke-linejoin="round"/><path d="M20 11L20 27" stroke="#fff" opacity=".24" stroke-width="1.8"/>',
  bell:'<path d="M18 6a2 2 0 0 1 4 0" stroke="#d4ba83" stroke-width="2" fill="none"/><path d="M12 16a8 8 0 0 1 16 0v9c0 3 2 5 5 8H7c3-3 5-5 5-8Z" fill="currentColor" stroke="#d4ba83" stroke-width="1.4"/><path d="M15 15c-2 5-2 9-2 12" stroke="#fff" stroke-width="2.5" opacity=".24" fill="none"/><circle cx="20" cy="35" r="4" fill="#d5b987"/>'
 };
 svg.innerHTML=paths[shape]||paths.bauble;return svg;
}
function syncScores(){state.scores=[0,1].map(p=>state.ornaments.filter(o=>o.owner===p).length)}
function addOrnament(player){
 const used=new Set(state.ornaments.map(o=>o.slot));
 const free=state.slotOrder.find(i=>!used.has(i));
 const id=++state.nextOrnamentId;
 state.ornaments.push({id,owner:player,shape:SHAPES[Math.floor(Math.random()*3)],slot:free===undefined?state.ornaments.length%ornamentSlots.length:free});
 state.animatedIds.push(id);syncScores();
}
function giveOrnament(from,to){
 const possible=state.ornaments.filter(o=>o.owner===from);
 if(!possible.length)return false;
 possible[Math.floor(Math.random()*possible.length)].owner=to;
 syncScores();return true;
}
function exchangeOrnaments(player){
 const them=1-player;
 if(state.scores[player]<1||state.scores[them]<2)return false;
 const offered=state.ornaments.find(o=>o.owner===player);
 const received=state.ornaments.filter(o=>o.owner===them).slice(0,2);
 offered.owner=them;for(const o of received)o.owner=player;
 syncScores();return true;
}
function drawOrnaments(){
 const b=$("ornaments");b.replaceChildren();
 const [x,y,w,h]=TREE[$("theme").value];
 Object.assign(b.style,{left:x+"%",top:y+"%",width:w+"%",height:h+"%"});
 const fresh=new Set(state.animatedIds);
 for(const o of state.ornaments){
  const [px,py]=ornamentSlots[o.slot%ornamentSlots.length];
  const el=document.createElement("span");
  el.className="ornament "+(o.owner===0?"teacher":"student")+(fresh.has(o.id)?" new":"");
  el.style.left=px+"%";el.style.top=py+"%";
  el.title=(o.owner===0?"Teacher":"Student")+" · "+o.shape;
  el.append(ornamentSVG(o.shape));b.append(el);
 }
 state.animatedIds=[];
}
function fitScene(){
  const scene=$("scene"),wrap=$("sceneWrap");
  if(!scene||!wrap)return;
  const ratio=$("theme").value==="village"?1648/928:4/3;
  const bounds=wrap.getBoundingClientRect();
  if(bounds.width<1||bounds.height<1)return;
  const width=Math.max(1,Math.min(bounds.width,bounds.height*ratio,1648));
  scene.style.width=width+"px";
  scene.style.height=(width/ratio)+"px";
}
function render(){let theme=$("theme").value;$("scene").dataset.theme=theme;$("ts").textContent=state.scores[0];$("ss").textContent=state.scores[1];$("doors").textContent=state.opened.length;$("turn").textContent=state.ended?"Session finished":(state.turn?"Student":"Teacher")+"'s turn";
$("nextDoor").textContent=Math.min(24,state.opened.length+1);let wrap=$("hotspots"),mobile=$("mobileBoard");wrap.replaceChildren();mobile.replaceChildren();POS[theme].forEach(([x,y,w,h],index)=>{let opened=state.opened.includes(index),n=state.numbers[index];let btn=document.createElement("button");btn.className="hotspot"+(opened?" opened":"");btn.style.left=x+"%";btn.style.top=y+"%";btn.style.width=w+"%";btn.style.height=h+"%";btn.textContent=n;btn.setAttribute("aria-label","Door "+n+(opened?", completed":""));btn.disabled=opened||state.ended||state.active!==null;btn.onclick=()=>openDoor(index);wrap.append(btn);
let small=document.createElement("button");small.textContent=n;small.className=opened?"opened":"";small.disabled=opened||state.ended||state.active!==null;small.onclick=()=>openDoor(index);mobile.append(small)});drawOrnaments();fitScene()}
function showModal(){const m=$("modal");m.hidden=false}
function hideModal(){state.active=null;$("modal").hidden=true;$("dialog").replaceChildren();render()}
function actionButton(txt,cb,klass=""){const btn=document.createElement("button");btn.textContent=txt;btn.className=klass;btn.onclick=cb;return btn}
function addPoints(p,n){for(let i=0;i<n;i++)addOrnament(p);finish()}
function finish(){state.opened.push(state.active.index);state.used.push(state.active.task[2]);state.turn=1-state.turn;hideModal()}
function openDoor(index){
 if(state.ended||state.active!==null||state.opened.includes(index))return;
 const number=state.numbers[index],next=state.opened.length+1;
 if(number!==next){$("message").textContent="Find door "+next+" to continue!";return}
 let task=selectTask();
 if(!task){$("message").textContent="No unused approved challenges remain for this level. We need more content for a full 24-door session.";return}
 state.active={index,task};render();const d=$("dialog");d.replaceChildren();
 const close=document.createElement("button");close.type="button";close.className="modalClose";close.textContent="×";close.setAttribute("aria-label","Close challenge; keep door closed");close.onclick=hideModal;d.append(close);
 const c=document.createElement("div");c.className="type";c.textContent=CATS[task[1]]+" · "+$("level").value+" · Door "+number;
 const title=document.createElement("h2");title.textContent=task[2];
 const q=document.createElement("p");q.className="question";q.textContent=task[3];d.append(c,title,q);
 if(task[1]==="picture"){const n=document.createElement("p");n.className="reminder";n.textContent="Picture illustration still pending; teacher guidance describes the intended picture.";d.append(n)}
 const teacherTurn=state.turn===0;
 if(teacherTurn){const notes=document.createElement("div");notes.className="teacherNotes";const heading=document.createElement("strong");heading.textContent="Teacher notes / answer";const body=document.createElement("div");body.textContent=task[4];notes.append(heading,body);d.append(notes)}
 const a=document.createElement("div");a.className="actions";a.style.setProperty("--action-count",teacherTurn?"3":"2");
 const button=(text,handler,cls)=>actionButton(text,handler,cls);
 const special=task[5];
 function accept(){
   if(special==="both"){addOrnament(0);addOrnament(1);finish()}
   else if(special==="transfer1"){giveOrnament(1-state.turn,state.turn);finish()}
   else if(special==="trade2"){exchangeOrnaments(state.turn);finish()}
 }
 const award=()=>addPoints(state.turn,1);
 const noaward=()=>finish();
 if(special==="both"||special==="transfer1"||special==="trade2"){
   a.append(button("Declined / no decoration",noaward,"noaward"),button("Accepted",accept,"award"));
 }else if(special==="gamble"){
   a.append(button("Guaranteed +1",award,"noaward"),button("Gamble 50/50",()=>{
     const points=Math.random()<.5?3:0;for(let i=0;i<points;i++)addOrnament(state.turn);
     window.alert(points?"You won 3 decorations!":"No decorations this time.");finish()
   },"award"));
 }else if(special==="opponentchallenge"){
   a.append(button("Opponent succeeds",()=>addPoints(1-state.turn,1),"award"),
            button("Opponent fails",()=>addPoints(state.turn,1),"noaward"));
 }else if(teacherTurn){
   a.append(button("No decoration",noaward,"noaward"),
            button("Award 1 decoration",award,"award"));
 }else{
   a.append(button("Award 1 decoration",award,"award"),
            button("No decoration",noaward,"noaward"));
 }
 if(teacherTurn)a.append(button("Cancel — keep door closed",hideModal,"cancel"));
 d.append(a);showModal()
}

function startNew(){if((state.opened.length||state.active!==null)&&!confirm("Start a new game? This clears the current progress."))return;state={turn:0,scores:[0,0],ornaments:[],nextOrnamentId:0,animatedIds:[],slotOrder:shuffle(Array.from({length:ornamentSlots.length},(_,i)=>i)),opened:[],used:[],numbers:shuffle(Array.from({length:24},(_,i)=>i+1)),ended:false,active:null};$("message").textContent="Classroom mode: two players share one screen. Choose a door to begin.";render()}
function finale(){if(state.active!==null)return;if(!confirm("End this lesson and reveal the results?"))return;state.ended=true;render();const d=$("dialog");d.replaceChildren();const box=document.createElement("div");box.id="finish";const h=document.createElement("h2");h.className="finalTitle";h.textContent="✧ Christmas Grand Finale ✧";
const p=document.createElement("p");p.textContent=state.opened.length+" of 24 doors opened";const s=document.createElement("h2");s.textContent="⚪ "+state.scores[0]+" : "+state.scores[1]+" 🔴";
const w=document.createElement("h2");w.textContent=state.scores[0]===state.scores[1]?"A festive draw!":state.scores[0]>state.scores[1]?"Teacher wins!":"Student wins!";
const c=document.createElement("p");c.textContent="Our tree holds every decoration earned this session. Merry Christmas!";
const a=document.createElement("div");a.className="actions";a.style.justifyContent="center";a.append(actionButton("See our decorated tree",hideModal),actionButton("New game",()=>{hideModal();startNew()},"alt"));box.append(h,p,s,w,c,a);d.append(box);showModal()}
$("new").onclick=startNew;$("end").onclick=finale;$("level").onchange=()=>startNew();$("theme").onchange=render;window.addEventListener("resize",fitScene);window.addEventListener("orientationchange",()=>requestAnimationFrame(fitScene));$("classroom").onclick=()=>alert("Classroom mode is active. Both players use one screen. This Christmas prototype does not yet include remote synchronized rooms.");$("help").onclick=()=>alert("Take turns choosing a door. Speak, solve, or negotiate the revealed challenge. Players decide whether to award decorations. White is the teacher, dark red is the student. Click End Session at any time. This is a classroom prototype using the approved sample questions only.");
window.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("modal").hidden&&!state.ended){hideModal()}});
